[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricingagents"
version = "0.0.1"
description = "Agents for non-life and life insurance pricing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "David Fischer", email = "fischerdm1@outlook.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/fischerdm/pricingagents"

# mammuthus and olivetree join the nonlife and life extras once their plain
# library releases are published.
[project.optional-dependencies]
agents = ["anthropic"]
nonlife = ["pricingagents[agents]"]
life = ["pricingagents[agents]"]
mcp = ["mcp"]
dashboard = ["streamlit", "plotly"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/pricingagents"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
only-include = ["src/pricingagents", "README.md", "LICENSE", "pyproject.toml"]
